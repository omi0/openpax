packages:
  - apps/*
  - packages/*
  - e2e

# Single source of truth for versions across the monorepo.
catalog:
  typescript: ^7.0.2
  zod: ^4.5.0
  hono: ^4.13.0
  "@hono/zod-openapi": ^1.6.0
  "@hono/node-server": ^2.1.0
  better-auth: ^1.7.3
  "@better-auth/drizzle-adapter": ^1.7.3
  "@better-auth/api-key": ^1.7.3
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.23.0
  "@types/pg": ^8.23.0
  pg-boss: ^12.30.0
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  vite: ^8.2.0
  "@vitejs/plugin-react": ^6.1.0
  "@tanstack/react-router": ^1.170.0
  "@tanstack/router-plugin": ^1.168.0
  "@tanstack/react-query": ^5.100.0
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  preact: ^10.29.0
  "@preact/preset-vite": ^2.10.0
  "@preact/signals": ^2.11.0
  i18next: ^26.2.0
  react-i18next: ^17.0.0
  react-email: ^6.9.0
  nodemailer: ^10.0.0
  date-fns: ^4.4.0
  "@date-fns/tz": ^1.5.0
  libphonenumber-js: ^1.13.0
  pino: ^10.0.0
  pino-pretty: ^13.0.0
  vitest: ^5.0.0
  testcontainers: ^12.1.0
  "@testcontainers/postgresql": ^12.1.0
  "@playwright/test": ^1.63.0
  "@biomejs/biome": ^2.5.0
  turbo: ^2.10.0
  tsx: ^4.23.0
  tsdown: ^0.23.0
  "@types/node": ^24.0.0

# Packages that are allowed to run install scripts.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  "@tailwindcss/oxide": true
  "@parcel/watcher": true
  # transitive deps of testcontainers; native/optional builds not needed
  cpu-features: false
  protobufjs: false
  ssh2: false
