# Development dependencies only: run the apps with `pnpm dev`.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openpax
      POSTGRES_PASSWORD: openpax
      POSTGRES_DB: openpax
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  pgdata-dev:
