# Production-style stack: OpenPax + Postgres. Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpax}
      POSTGRES_DB: ${POSTGRES_DB:-openpax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpax} -d ${POSTGRES_DB:-openpax}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: openpax:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # BIND_IP lets you publish only on one interface, e.g. a Tailscale IP
      - "${BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openpax}:${POSTGRES_PASSWORD:-openpax}@db:5432/${POSTGRES_DB:-openpax}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT: ${RATE_LIMIT:-on}
      APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  pgdata:
